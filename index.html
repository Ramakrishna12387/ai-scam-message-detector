<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scam Detector - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { max-width: 420px; width: 100%; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 35px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); }
        .icon-box { text-align: center; margin-bottom: 15px; font-size: 50px; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 6px; font-size: 24px; }
        .subtitle { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; font-size: 13px; }
        input { width: 100%; padding: 13px 15px; background: #0f172a; border: 1.5px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; margin-top: 10px; transition: 0.2s; }
        .btn:hover { opacity: 0.95; transform: translateY(-1px); }
        .demo-hint { text-align: center; font-size: 12px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">🛡️</div>
        <h2>Portal Login</h2>
        <p class="subtitle">AI Scam Detector Verification Suite</p>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="admin" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="1234" required autocomplete="off">
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div class="demo-hint">Demo Access: <b>admin</b> / <b>1234</b></div>
        </form>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            if (u === "admin" && p === "1234") {
                sessionStorage.setItem("user", u);
                window.location.href = "dashboard.html";
            } else {
                alert("Invalid Credentials! (admin / 1234)");
            }
        }
    </script>
</body>
</html>
